name: CI

on:
  push:
    branches: [master, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Static checks and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
      - run: npm install --global yarn@1.22.22
      - run: yarn install --frozen-lockfile --non-interactive
      - name: Lint
        run: yarn lint
      - name: Formatting
        run: yarn format:check
      - name: Type check and build
        run: yarn build
      - name: Unit tests
        run: yarn test:unit --reporter=default --reporter=junit --outputFile=artifacts/unit.xml
      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: unit-results
          path: artifacts/unit.xml
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload tested plugin build
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: plugin-build
          path: |
            main.js
            manifest.json
            styles.css
          if-no-files-found: error
          retention-days: 7

  e2e:
    name: Obsidian E2E (Linux)
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
      - run: npm install --global yarn@1.22.22
      - run: yarn install --frozen-lockfile --non-interactive
      - name: Download tested plugin build
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: plugin-build
      - name: Install virtual display and window manager
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth herbstluftwm
      - name: Run Obsidian E2E tests
        run: |
          xvfb-run -a --server-args="-screen 0 1280x1024x24" \
            sh -c 'herbstluftwm & yarn test:e2e'
      - name: Upload E2E logs and failure screenshots
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: obsidian-e2e-results
          path: artifacts/e2e
          if-no-files-found: ignore
          retention-days: 7
